<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교회회계부 앱 받기</title>
<style>
  :root {
    --bg: #f5f3ee;
    --card-bg: #ffffff;
    --border: #e4dfd4;
    --text: #2b2620;
    --sub: #8a7f6e;
    --accent: #4f8a5b;
    --accent-dark: #3f6f49;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .icon { font-size: 2.2rem; margin-bottom: 10px; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p.desc { color: var(--sub); font-size: 0.9rem; margin: 0 0 26px; line-height: 1.5; }
  input[type="email"] {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    margin-bottom: 12px;
    outline: none;
  }
  input[type="email"]:focus { border-color: var(--accent); }
  button {
    width: 100%;
    padding: 13px 14px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 0.98rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { margin-top: 14px; font-size: 0.85rem; min-height: 1.2em; }
  .msg.error { color: #c0392b; }
</style>
</head>
<body>
  <div class="card">
    <div class="form-view" id="formView">
      <div class="icon">🧮</div>
      <h1>교회회계부 앱 받기</h1>
      <p class="desc">이메일 주소를 남겨주시면<br>바로 앱으로 이동합니다.</p>
      <form id="requestForm">
        <input type="email" id="emailInput" placeholder="이메일 주소" required>
        <button type="submit" id="submitBtn">받기를 원합니다</button>
      </form>
    </div>
  </div>

<script>
  // 1) formspree.io 에서 Form을 만들고 아래 값을 발급받은 엔드포인트로 교체하세요.
  //    예: https://formspree.io/f/abcdwxyz
  const FORMSPREE_ENDPOINT = "https://formspree.io/f/mkjgrvzn";

  // 버튼을 누르면 바로 이 주소(교회회계 앱)로 이동합니다.
  const APP_URL = "https://jaeseolkang.github.io/finances";

  const form = document.getElementById('requestForm');
  const emailInput = document.getElementById('emailInput');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = emailInput.value.trim();
    if (!email) return;

    submitBtn.disabled = true;
    submitBtn.textContent = '앱으로 이동 중...';

    // 신청 내용은 전송하되, 결과와 관계없이 바로 앱을 엽니다.
    // (전송이 늦어져도 최대 2초만 기다린 뒤 이동)
    const send = fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      keepalive: true,
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        _subject: '교회회계부 앱 다운로드 요청'
      })
    }).catch(() => {});
    const wait = new Promise((resolve) => setTimeout(resolve, 2000));
    await Promise.race([send, wait]);

    window.location.href = APP_URL;
  });
</script>
</body>
</html>
